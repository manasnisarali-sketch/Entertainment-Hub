<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entertainment Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0b0b12;color:#fff}
header{background:linear-gradient(135deg,#17172a,#27204a);padding:22px 6%;display:flex;justify-content:space-between;align-items:center;gap:20px;position:sticky;top:0;z-index:10}
.logo{font-size:28px;font-weight:800;color:#fff}.logo span{color:#8b5cf6}
.search{width:280px;padding:12px 16px;border:1px solid #444;border-radius:25px;background:#11111b;color:#fff;outline:none}
nav{background:#11111b;padding:14px 6%;display:flex;gap:12px;overflow:auto}
nav button{background:#222231;color:#ddd;border:0;padding:10px 18px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav button:hover{background:#8b5cf6;color:#fff}
.hero{padding:70px 6%;background:linear-gradient(90deg,rgba(11,11,18,.98),rgba(11,11,18,.55)),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80') center/cover}
.hero h1{font-size:48px;margin-bottom:15px}.hero p{max-width:600px;color:#ccc;line-height:1.6}
.hero button{margin-top:22px;padding:13px 24px;border:0;border-radius:25px;background:#8b5cf6;color:#fff;font-size:16px;cursor:pointer}
section{padding:35px 6%}.title{font-size:26px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px}
.card{background:#171722;border-radius:14px;overflow:hidden;transition:.25s;box-shadow:0 5px 20px rgba(0,0,0,.25)}
.card:hover{transform:translateY(-5px)}
.poster{height:240px;background-size:cover;background-position:center}
.info{padding:14px}.info h3{font-size:17px;margin-bottom:7px}.info p{font-size:13px;color:#999}
footer{text-align:center;padding:30px;color:#777;background:#11111b;margin-top:30px}
@media(max-width:650px){header{flex-direction:column;align-items:stretch}.search{width:100%}.hero h1{font-size:36px}}
</style>
</head>
<body>

<header>
  <div class="logo">Entertainment <span>Hub</span></div>
  <input id="search" class="search" type="text" placeholder="Search entertainment...">
</header>

<nav>
  <button onclick="filterCards('All')">All</button>
  <button onclick="filterCards('Movies')">Movies</button>
  <button onclick="filterCards('Dramas')">Dramas</button>
  <button onclick="filterCards('Cartoons')">Cartoons</button>
  <button onclick="filterCards('Anime')">Anime</button>
  <button onclick="filterCards('Comedy')">Comedy</button>
</nav>

<div class="hero">
  <h1>Your Entertainment World</h1>
  <p>Explore movies, dramas, cartoons, anime and comedy — all in one modern Entertainment Hub.</p>
  <button onclick="document.getElementById('content').scrollIntoView({behavior:'smooth'})">Explore Now</button>
</div>

<section id="content">
  <h2 class="title">Popular Now</h2>
  <div class="grid" id="cards"></div>
</section>

<footer>© 2026 Entertainment Hub — Your world of entertainment</footer>

<script>
const items=[
 {name:"Action Movie",cat:"Movies",img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=600&q=80"},
 {name:"Drama Night",cat:"Dramas",img:"https://images.unsplash.com/photo-1503095396549-807759245b35?auto=format&fit=crop&w=600&q=80"},
 {name:"Funny Cartoon",cat:"Cartoons",img:"https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80"},
 {name:"Anime World",cat:"Anime",img:"https://images.unsplash.com/photo-1560972550-aba3456b5564?auto=format&fit=crop&w=600&q=80"},
 {name:"Comedy Show",cat:"Comedy",img:"https://images.unsplash.com/photo-1527224857830-43a7acc85260?auto=format&fit=crop&w=600&q=80"},
 {name:"Adventure",cat:"Movies",img:"https://images.unsplash.com/photo-1513106580091-1d82408b8cd6?auto=format&fit=crop&w=600&q=80"},
 {name:"Family Drama",cat:"Dramas",img:"https://images.unsplash.com/photo-1485095329183-d0797cdc5676?auto=format&fit=crop&w=600&q=80"},
 {name:"Anime Hero",cat:"Anime",img:"https://images.unsplash.com/photo-1618336753974-aae8e04506aa?auto=format&fit=crop&w=600&q=80"}
];

function show(list){
 const box=document.getElementById("cards");
 box.innerHTML=list.map(x=>`<div class="card"><div class="poster" style="background-image:url('${x.img}')"></div><div class="info"><h3>${x.name}</h3><p>${x.cat}</p></div></div>`).join("");
}
function filterCards(cat){
 show(cat==="All"?items:items.filter(x=>x.cat===cat));
}
document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase();
 show(items.filter(x=>x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q)));
});
show(items);
</script>
</body>
</html>
